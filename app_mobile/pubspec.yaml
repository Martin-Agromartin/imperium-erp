YAML
name: imperium_erp
description: ERP profesional para distribuidoras de agua
publish_to: 'none'
version: 0.1.0+1

environment:
sdk: '>=3.6.0 <4.0.0'

dependencies:
flutter:
sdk: flutter
cupertino_icons: ^1.0.8

flutter_riverpod: ^2.6.1
go_router: ^16.0.0

google_fonts: ^6.3.0

intl: ^0.20.2

uuid: ^4.5.1

equatable: ^2.0.7

flutter_svg: ^2.2.0

shared_preferences: ^2.5.3

connectivity_plus: ^7.0.0

package_info_plus: ^8.3.1


# Navegación
go_router: ^14.6.1

# Estado
provider: ^6.1.2

# UI
google_fonts: ^6.2.1
flutter_svg: ^2.0.16

# Utilidades
intl: ^0.19.0
uuid: ^4.5.1

# Firebase (los usaremos más adelante)
firebase_core: ^3.8.0
firebase_auth: ^5.3.3
cloud_firestore: ^5.5.0
firebase_storage: ^12.3.6

dev_dependencies:
flutter_test:
sdk: flutter
flutter_lints: ^5.0.0

flutter:
uses-material-design: true

assets:
- assets/images/
- assets/icons/
- assets/logo/

fonts:
- family: Montserrat
fonts:
- asset: assets/fonts/Montserrat-Regular.ttf
- asset: assets/fonts/Montserrat-SemiBold.ttf

- family: Inter
fonts:
- asset: assets/fonts/Inter-Regular.ttf

flutter_riverpod: ^2.6.1
